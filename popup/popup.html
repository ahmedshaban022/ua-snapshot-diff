<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: dark; }
    body {
      width: 300px; margin: 0; padding: 14px;
      font: 13px/1.4 system-ui, sans-serif; color: #e5e7eb;
      background: #111827;
    }
    h1 { font-size: 13px; margin: 0 0 10px; color: #a78bfa; letter-spacing: .4px; }
    .page { font-size: 11px; color: #6b7280; margin: -6px 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    button {
      padding: 8px 10px; border: 0; border-radius: 8px; cursor: pointer;
      font: 600 12px system-ui, sans-serif;
    }
    #capture { flex: 1; background: #7c3aed; color: #fff; }
    #capture:hover { background: #6d28d9; }
    #open { background: #374151; color: #e5e7eb; }
    #open:hover { background: #4b5563; }
    input[type="text"] {
      width: 100%; background: #1f2937; color: #e5e7eb; border: 1px solid #374151;
      border-radius: 6px; padding: 5px 7px; font: 12px system-ui; margin-bottom: 8px;
    }
    h2 { font-size: 10px; margin: 12px 0 6px; color: #6b7280; text-transform: uppercase; letter-spacing: .8px; }
    .snap {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin-bottom: 4px;
      background: #1f2937; border-radius: 8px; cursor: pointer;
    }
    .snap.sel { outline: 1px solid #7c3aed; }
    .snap .radio { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #6b7280; flex: none; }
    .snap.sel .radio { border-color: #7c3aed; background: #7c3aed; }
    .snap .meta { flex: 1; min-width: 0; }
    .snap .lbl { font-size: 12px; color: #e5e7eb; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .snap .sub { font-size: 10px; color: #6b7280; }
    .snap .del { background: none; border: 0; color: #9ca3af; cursor: pointer; font-size: 13px; padding: 0 2px; }
    .snap .del:hover { color: #f87171; }
    #diffbtn { width: 100%; background: #0e7490; color: #fff; margin-bottom: 8px; }
    #diffbtn:hover { background: #155e75; }
    #diffbtn:disabled { background: #374151; color: #6b7280; cursor: default; }
    .empty { color: #6b7280; font-size: 11px; }
    #stats { margin-top: 8px; font-size: 12px; color: #9ca3af; min-height: 16px; }
    #stats b { color: #22d3ee; }
    .hint { margin-top: 8px; font-size: 11px; color: #6b7280; }
    kbd { background: #1f2937; border-radius: 4px; padding: 1px 5px; font-size: 10px; }
  </style>
</head>
<body>
  <h1>UA CHANGE SNAPSHOT</h1>
  <div class="page" id="page">…</div>
  <input id="label" type="text" placeholder="Snapshot label (e.g. pre-deploy v3.14)" maxlength="60" />
  <div class="row">
    <button id="capture">Capture</button>
    <button id="open">Viewer ↗</button>
  </div>
  <h2>This page's snapshots</h2>
  <div id="list"></div>
  <button id="diffbtn" disabled>Capture &amp; diff vs baseline</button>
  <div id="stats"></div>
  <div class="hint">Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd>, or right-click the page.<br />Select a snapshot's dot to make it the baseline.</div>
  <script type="module" src="popup.js"></script>
</body>
</html>
